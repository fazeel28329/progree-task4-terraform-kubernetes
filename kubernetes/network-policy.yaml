apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: progree-task4-network-policy
  namespace: progree-task4
spec:
  podSelector:
    matchLabels:
      app: progree-task4
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
