apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: progree-task4-hpa
  namespace: progree-task4
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: progree-task4-app
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
